name: Diagnose Nomreh authentication

on:
  push:
    branches:
      - arena/f4b832aa-animation

permissions:
  contents: read
  checks: write

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[auth-diagnostic]')
    runs-on: ubuntu-latest
    steps:
      - name: Probe the deployed authentication endpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOMREH_BASE_URL: https://nomreh.rust-specialist.workers.dev
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/nomreh-auth-diagnostic.json
          const base = process.env.NOMREH_BASE_URL;
          const results = [];
          async function probe(name, path, init) {
            try {
              const response = await fetch(base + path, { redirect: 'manual', ...init });
              const text = await response.text();
              let detail = '';
              try { detail = JSON.parse(text).error || ''; } catch { detail = response.status === 200 ? 'HTML response received' : text.slice(0, 180); }
              results.push({ name, status: response.status, detail });
            } catch (error) {
              results.push({ name, status: 0, detail: error instanceof Error ? error.message : String(error) });
            }
          }
          await probe('login page', '/login');
          for (const username of ['nomreh_admin', 'nomreh_teacher']) {
            await probe(`invalid-password probe: ${username}`, '/api/auth/login', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ username, password: 'invalid-diagnostic-password-9x7Q' }),
            });
          }
          console.log(JSON.stringify({ base, results }, null, 2));
          NODE
          cat /tmp/nomreh-auth-diagnostic.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Nomreh authentication diagnostic" \
            -f head_sha="${GITHUB_SHA}" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Nomreh authentication diagnostic' \
            --raw-field "output[summary]=$(cat /tmp/nomreh-auth-diagnostic.json)" > /dev/null
