name: Cloudflare connectivity probe

on:
  push:
    branches:
      - arena/f4b832aa-animation
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare temporary deployment access
        id: deploy
        run: |
          set -u
          mkdir -p /tmp/nomreh-cf-probe
          printf '%s\n' 'export default { fetch() { return new Response("Nomreh Cloudflare probe"); } };' > /tmp/nomreh-cf-probe/worker.js
          printf '%s\n' '{"name":"nomreh-cloudflare-probe","main":"/tmp/nomreh-cf-probe/worker.js","compatibility_date":"2026-10-28","workers_dev":true}' > /tmp/nomreh-cf-probe/wrangler.json
          set +e
          npx --yes wrangler deploy --temporary --config /tmp/nomreh-cf-probe/wrangler.json 2>&1 | tee /tmp/nomreh-cf-probe/output.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish deployment output
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_STATUS: ${{ steps.deploy.outputs.status }}
        run: |
          conclusion=success
          if [ "${RUN_STATUS:-1}" != "0" ]; then conclusion=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Cloudflare deployment output" \
            -f head_sha="${GITHUB_SHA}" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f output.title="Cloudflare deployment output" \
            --raw-field output.summary="$(cat /tmp/nomreh-cf-probe/output.log)"
