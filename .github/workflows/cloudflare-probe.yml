name: Cloudflare connectivity probe

on:
  push:
    branches:
      - arena/f4b832aa-animation
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare temporary deployment access
        id: deploy
        run: |
          set -u
          mkdir -p /tmp/nomreh-cf-probe
          printf '%s\n' 'export default { fetch() { return new Response("Nomreh Cloudflare probe"); } };' > /tmp/nomreh-cf-probe/worker.js
          printf '%s\n' '{"name":"nomreh-cloudflare-probe","main":"/tmp/nomreh-cf-probe/worker.js","compatibility_date":"2026-10-28","workers_dev":true}' > /tmp/nomreh-cf-probe/wrangler.json
          set +e
          npx --yes wrangler deploy --temporary --config /tmp/nomreh-cf-probe/wrangler.json 2>&1 | tee /tmp/nomreh-cf-probe/output.log
          status=${PIPESTATUS[0]}
          if [ "$status" = "0" ]; then
            node <<'NODE'
          const fs = require('node:fs');
          const path = `${process.env.HOME}/.config/.wrangler/wrangler-temporary-account.toml`;
          const text = fs.readFileSync(path, 'utf8');
          const token = text.match(/apiToken\s*=\s*[\"']([^\"']+)[\"']/)?.[1];
          const account = text.match(/\bid\s*=\s*[\"']([^\"']+)[\"']/)?.[1];
          if (!token || !account) throw new Error('Temporary Cloudflare credentials were not found');
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${token}\nCLOUDFLARE_ACCOUNT_ID=${account}\n`);
          fs.writeFileSync('/tmp/nomreh-cf-probe/env.sh', `export CLOUDFLARE_API_TOKEN=${token}\nexport CLOUDFLARE_ACCOUNT_ID=${account}\n`);
          NODE
            source /tmp/nomreh-cf-probe/env.sh
            npx --yes wrangler d1 create nomreh-probe-db --config /tmp/nomreh-cf-probe/wrangler.json --update-config=false 2>&1 | tee -a /tmp/nomreh-cf-probe/output.log
            d1_status=${PIPESTATUS[0]}
            npx --yes wrangler kv namespace create UPLOADS_KV --config /tmp/nomreh-cf-probe/wrangler.json --update-config=false 2>&1 | tee -a /tmp/nomreh-cf-probe/output.log
            kv_status=${PIPESTATUS[0]}
            if [ "$d1_status" != "0" ] || [ "$kv_status" != "0" ]; then status=1; fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish deployment output
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_STATUS: ${{ steps.deploy.outputs.status }}
        run: |
          conclusion=success
          if [ "${RUN_STATUS:-1}" != "0" ]; then conclusion=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Cloudflare deployment output" \
            -f head_sha="${GITHUB_SHA}" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f 'output[title]=Cloudflare deployment output' \
            --raw-field 'output[summary]='"$(cat /tmp/nomreh-cf-probe/output.log)"
