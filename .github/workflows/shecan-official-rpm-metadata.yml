name: Pin official Shecan Linux RPM

on:
  push:
    branches: [arena/f4b832aa-animation]
    paths: [.github/workflows/shecan-official-rpm-metadata.yml]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  official-rpm-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download the versioned official package without executing it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url='https://dl.shecan.ir/download/linux/amd64?version=v3.0.30&format=rpm'
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            --max-time 180 --user-agent 'Mozilla/5.0 (X11; Linux x86_64)' \
            --output "$RUNNER_TEMP/shecan-v3.0.30-linux-amd64.rpm" "$url"
          file "$RUNNER_TEMP/shecan-v3.0.30-linux-amd64.rpm"
          bytes="$(stat -c %s "$RUNNER_TEMP/shecan-v3.0.30-linux-amd64.rpm")"
          test "$bytes" -gt 50000000
          test "$bytes" -lt 120000000
          hash="$(sha256sum "$RUNNER_TEMP/shecan-v3.0.30-linux-amd64.rpm" | cut -d' ' -f1)"
          summary="Official Shecan v3.0.30 Linux x86-64 RPM, downloaded over HTTPS and not executed. Bytes: ${bytes}. SHA-256: ${hash}."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Official Shecan RPM metadata" -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=neutral \
            -f 'output[title]=Versioned official package hash' \
            --raw-field "output[summary]=${summary}" > /dev/null
