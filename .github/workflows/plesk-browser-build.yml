name: Plesk Nomreh production build

on:
  push:
    branches:
      - arena/f4b832aa-animation
    paths:
      - .github/workflows/plesk-browser-build.yml
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: plesk-nomreh-production-build
  cancel-in-progress: false

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - name: Check private Plesk browser configuration
        id: config
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
        run: |
          set -u
          configured=false
          if [ -n "$PLESK_PANEL_URL" ] && [ -n "$PLESK_API_USERNAME" ] && [ -n "$PLESK_API_PASSWORD" ]; then configured=true; fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Check out the browser control script
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Verify the Passenger-aware archive extraction
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          extract_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/41534001639" --jq '.status + " " + .conclusion')"
          test "$extract_state" = "completed success"
          grep -F 'Nomreh Passenger-aware launcher is active for this build.' scripts/plesk-node22.cjs > /dev/null
          grep -F 'return [mainFile];' scripts/plesk-node22.cjs > /dev/null
          grep -F 'syncPublicStatic();' scripts/plesk-node22.cjs > /dev/null

      - name: Confirm the validated npm launcher fix
        if: steps.config.outputs.configured == 'true'
        run: echo "abafaf85f46b391dcbd9f675a5b1eb959555870eae8667290c6ab8216190d9c0  package.json" | sha256sum --check -

      - name: Confirm the validated obsolete-artifact exclusions
        if: steps.config.outputs.configured == 'true'
        run: echo "5fdf01154fffcabbfe558a67a43268bafd0b0300f83117021239b66f8a765515  tsconfig.json" | sha256sum --check -

      - name: Prepare an isolated temporary browser
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plesk-browser"
          cd "$RUNNER_TEMP/plesk-browser"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Run and watch the Nomreh production build
        id: build
        if: steps.config.outputs.configured == 'true'
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          PLESK_BROWSER_ACTION: build
          PLESK_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/nomreh-plesk-build.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/plesk-browser-diagnostics.cjs

      - name: Publish the sanitized build result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIGURED: ${{ steps.config.outputs.configured }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          conclusion=neutral
          summary='Plesk browser build is not configured; no host was contacted.'
          if [ "$CONFIGURED" = true ]; then
            conclusion=success
            if [ "$BUILD_OUTCOME" != success ]; then conclusion=failure; fi
            if [ -f "$RUNNER_TEMP/nomreh-plesk-build.md" ]; then
              summary="$(cat "$RUNNER_TEMP/nomreh-plesk-build.md")"
            else
              summary='Build execution did not produce a report; Node.js was not enabled or restarted.'
            fi
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Plesk Nomreh production build" \
            -f head_sha="${GITHUB_SHA}" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f 'output[title]=Nomreh production build and runtime smoke tests' \
            --raw-field "output[summary]=${summary}" > /dev/null
