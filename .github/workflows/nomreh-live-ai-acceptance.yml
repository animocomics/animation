name: Nomreh live AI acceptance

# The redacted report is available both in the job summary and Check Run output.

on:
  push:
    branches: [arena/f4b832aa-animation]
    paths:
      - scripts/nomreh-live-ai-acceptance.cjs
      - scripts/fixtures/persian-handwriting-test.png
      - .github/workflows/nomreh-live-ai-acceptance.yml

permissions:
  contents: read
  checks: write

concurrency:
  group: nomreh-live-ai-acceptance
  cancel-in-progress: false

jobs:
  live-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install isolated test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright
      - name: Withdraw earlier diagnostic session metadata
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/check-runs/125388541779 \
            --raw-field 'output[title]=Nomreh live AI acceptance (redacted)' \
            --raw-field 'output[summary]=Earlier live grading returned HTTP 504 HTML. The diagnostic output was withdrawn because the client included session metadata in a network error. No provider key was included; no handwriting success was claimed.' >/dev/null
      - name: Run authorized live provider, usage, and handwriting checks
        env:
          NOMREH_ADMIN_USERNAME: ${{ secrets.NOMREH_ADMIN_USERNAME }}
          NOMREH_ADMIN_PASSWORD: ${{ secrets.NOMREH_ADMIN_PASSWORD }}
          NOMREH_TEACHER_USERNAME: ${{ secrets.NOMREH_TEACHER_USERNAME }}
          NOMREH_TEACHER_PASSWORD: ${{ secrets.NOMREH_TEACHER_PASSWORD }}
          NOMREH_RUN_HANDWRITING: "1"
          NOMREH_AI_ACCEPTANCE_OUTPUT: /tmp/nomreh-live-ai-acceptance.md
        run: node scripts/nomreh-live-ai-acceptance.cjs
      - name: Publish redacted evidence
        if: always()
        run: |
          test -s /tmp/nomreh-live-ai-acceptance.md
          python - <<'PY'
          from pathlib import Path
          import os, re
          text = Path('/tmp/nomreh-live-ai-acceptance.md').read_text()
          required = ['Current provider and recorded usage', 'Recorded usage before this check', 'Recorded usage after this check', 'Quota boundary', 'Result']
          if any(item not in text for item in required):
              raise SystemExit('The live AI report is incomplete')
          if re.search(r'AIza[0-9A-Za-z_-]{8,}|Bearer\s+[A-Za-z0-9]', text):
              raise SystemExit('The report contains a credential-like value')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text)
          print(text)
          PY
      - name: Store redacted report in the check run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s /tmp/nomreh-live-ai-acceptance.md
          check_id=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq '.check_runs[] | select(.name == "live-ai") | .id' | head -n 1)
          test -n "$check_id"
          python - <<'PY'
          import json
          from pathlib import Path
          text = Path('/tmp/nomreh-live-ai-acceptance.md').read_text()
          Path('/tmp/nomreh-check-payload.json').write_text(json.dumps({'output': {'title': 'Nomreh live AI acceptance', 'summary': text}}))
          PY
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${check_id}" --input /tmp/nomreh-check-payload.json >/dev/null
