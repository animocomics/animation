name: Plesk Nomreh TypeScript config update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/plesk-browser-update-tsconfig.yml
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: plesk-nomreh-browser-tsconfig
  cancel-in-progress: false

jobs:
  update-tsconfig:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Check private Plesk browser configuration
        id: config
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
        run: |
          set -u
          configured=false
          if [ -n "$PLESK_PANEL_URL" ] && [ -n "$PLESK_API_USERNAME" ] && [ -n "$PLESK_API_PASSWORD" ]; then configured=true; fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Check out the validated TypeScript configuration
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Confirm tsconfig.json matches the validated exclusion change
        if: steps.config.outputs.configured == 'true'
        env:
          EXPECTED_SHA256: 5fdf01154fffcabbfe558a67a43268bafd0b0300f83117021239b66f8a765515
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  tsconfig.json" | sha256sum --check -

      - name: Prepare an isolated temporary browser
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plesk-browser"
          cd "$RUNNER_TEMP/plesk-browser"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Upload and verify only the validated Nomreh tsconfig.json
        id: update
        if: steps.config.outputs.configured == 'true'
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          PLESK_BROWSER_ACTION: update-tsconfig
          PLESK_TSCONFIG_SHA256: 5fdf01154fffcabbfe558a67a43268bafd0b0300f83117021239b66f8a765515
          PLESK_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/nomreh-plesk-tsconfig.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/plesk-browser-diagnostics.cjs

      - name: Publish the sanitized TypeScript config update result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIGURED: ${{ steps.config.outputs.configured }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: |
          set -euo pipefail
          conclusion=neutral
          summary='Plesk browser control is not configured; no host was contacted.'
          if [ "$CONFIGURED" = true ]; then
            conclusion=success
            if [ "$UPDATE_OUTCOME" != success ]; then conclusion=failure; fi
            if [ -f "$RUNNER_TEMP/nomreh-plesk-tsconfig.md" ]; then
              summary="$(cat "$RUNNER_TEMP/nomreh-plesk-tsconfig.md")"
            else
              summary='The TypeScript config update did not produce a report; no build, restart, or further host change was attempted.'
            fi
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Plesk Nomreh TypeScript config update" \
            -f head_sha="${GITHUB_SHA}" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f 'output[title]=Nomreh validated TypeScript configuration update' \
            --raw-field "output[summary]=${summary}" > /dev/null
