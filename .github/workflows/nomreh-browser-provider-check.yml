name: Nomreh real-browser provider check

on:
  push:
    branches: [arena/f4b832aa-animation]
    paths:
      - scripts/nomreh-browser-provider-check.cjs
      - .github/workflows/nomreh-browser-provider-check.yml

permissions:
  contents: read
  checks: write

concurrency:
  group: nomreh-browser-provider-check
  cancel-in-progress: false

jobs:
  browser-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser diagnostics
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Run real-browser read-only provider check
        env:
          NOMREH_ADMIN_USERNAME: ${{ secrets.NOMREH_ADMIN_USERNAME }}
          NOMREH_ADMIN_PASSWORD: ${{ secrets.NOMREH_ADMIN_PASSWORD }}
          NOMREH_BROWSER_PROVIDER_OUTPUT: /tmp/nomreh-browser-provider.md
        run: node scripts/nomreh-browser-provider-check.cjs
      - name: Publish redacted browser evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s /tmp/nomreh-browser-provider.md
          python - <<'PY'
          from pathlib import Path
          import os, re
          text = Path('/tmp/nomreh-browser-provider.md').read_text()
          if re.search(r'AIza[0-9A-Za-z_-]{8,}|nomreh_session=[^ ]+|Bearer\s+[A-Za-z0-9]', text):
              raise SystemExit('Credential-like data was found in the browser report')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text)
          print(text)
          PY
      - name: Store browser evidence in check output
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s /tmp/nomreh-browser-provider.md
          check_id=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq '.check_runs[] | select(.name == "browser-provider") | .id' | head -n 1)
          test -n "$check_id"
          python - <<'PY'
          import json
          from pathlib import Path
          text = Path('/tmp/nomreh-browser-provider.md').read_text()
          Path('/tmp/nomreh-browser-check.json').write_text(json.dumps({'output': {'title': 'Nomreh real-browser provider check', 'summary': text}}))
          PY
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${check_id}" --input /tmp/nomreh-browser-check.json >/dev/null
