name: Build and upload harmless Shecan VM probe

on:
  push:
    branches: [arena/f4b832aa-animation]
    paths:
      - .github/workflows/shecan-vm-probe-upload.yml
      - scripts/shecan-vm/probe-init.c
      - scripts/shecan-vm/initramfs.py
      - scripts/shecan-vm/run-probe.sh
      - scripts/shecan-vm/build-probe.sh
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: plesk-nomreh-browser
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check private Plesk browser configuration
        id: config
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
        run: |
          configured=false
          if [ -n "$PLESK_PANEL_URL" ] && [ -n "$PLESK_API_USERNAME" ] && [ -n "$PLESK_API_PASSWORD" ]; then configured=true; fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Check out the harmless probe source
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Build and locally boot the networkless credential-free VM
        id: build
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nomreh-deploy-shecan-vm-probe-v1.zip"
          bash scripts/shecan-vm/build-probe.sh "$GITHUB_WORKSPACE" "$archive" 2>&1 | tee "$RUNNER_TEMP/shecan-vm-probe-build.log"
          sha256sum "$archive" > "$RUNNER_TEMP/shecan-vm-probe.sha256"

      - name: Prepare an isolated temporary browser
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plesk-browser"
          cd "$RUNNER_TEMP/plesk-browser"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Upload only the locally validated harmless VM archive
        id: upload
        if: steps.build.outcome == 'success'
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          PLESK_BROWSER_ACTION: upload
          PLESK_ARCHIVE_NAME: nomreh-deploy-shecan-vm-probe-v1.zip
          PLESK_UPLOAD_ARCHIVE: ${{ runner.temp }}/nomreh-deploy-shecan-vm-probe-v1.zip
          PLESK_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/nomreh-plesk-vm-probe-upload.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/plesk-browser-diagnostics.cjs

      - name: Publish the sanitized build and upload result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIGURED: ${{ steps.config.outputs.configured }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          conclusion=neutral
          summary='Plesk browser upload is not configured; no host was contacted.'
          if [ "$CONFIGURED" = true ]; then
            conclusion=success
            if [ "$BUILD_OUTCOME" != success ] || [ "$UPLOAD_OUTCOME" != success ]; then conclusion=failure; fi
            if [ -f "$RUNNER_TEMP/nomreh-plesk-vm-probe-upload.md" ]; then
              summary="$(cat "$RUNNER_TEMP/nomreh-plesk-vm-probe-upload.md")"
            elif [ "$BUILD_OUTCOME" != success ]; then
              summary='The harmless VM did not build or pass its local boot test. Nothing was uploaded and Plesk was not contacted.'
              if [ -f "$RUNNER_TEMP/shecan-vm-probe-build.log" ]; then
                summary="${summary}"$'\n\n```text\n'"$(tail -c 45000 "$RUNNER_TEMP/shecan-vm-probe-build.log")"$'\n```'
              fi
            else
              summary='The local VM passed, but the controlled upload did not produce a report. No extraction or execution on Plesk was attempted.'
            fi
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Harmless Shecan VM probe upload" \
            -f head_sha="${GITHUB_SHA}" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f 'output[title]=Networkless and credential-free VM validation' \
            --raw-field "output[summary]=${summary}" > /dev/null
