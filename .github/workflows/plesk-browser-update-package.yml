name: Plesk Nomreh package launcher update

on:
  push:
    branches:
      - arena/f4b832aa-animation
    paths:
      - .github/workflows/plesk-browser-update-package.yml
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: plesk-nomreh-browser-package
  cancel-in-progress: false

jobs:
  update-package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check private Plesk browser configuration
        id: config
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
        run: |
          set -u
          configured=false
          if [ -n "$PLESK_PANEL_URL" ] && [ -n "$PLESK_API_USERNAME" ] && [ -n "$PLESK_API_PASSWORD" ]; then configured=true; fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Check out and verify the legacy-tested package launcher
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Confirm package.json matches the validated application commit
        if: steps.config.outputs.configured == 'true'
        env:
          EXPECTED_SHA256: abafaf85f46b391dcbd9f675a5b1eb959555870eae8667290c6ab8216190d9c0
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  package.json" | sha256sum --check -

      - name: Prepare an isolated temporary browser
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plesk-browser"
          cd "$RUNNER_TEMP/plesk-browser"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Upload and verify only the validated Nomreh package.json
        id: update
        if: steps.config.outputs.configured == 'true'
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          PLESK_BROWSER_ACTION: update-package
          PLESK_PACKAGE_SHA256: abafaf85f46b391dcbd9f675a5b1eb959555870eae8667290c6ab8216190d9c0
          PLESK_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/nomreh-plesk-package.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/plesk-browser-diagnostics.cjs

      - name: Publish the sanitized package update result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIGURED: ${{ steps.config.outputs.configured }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: |
          set -euo pipefail
          conclusion=neutral
          summary='Plesk browser control is not configured; no host was contacted.'
          if [ "$CONFIGURED" = true ]; then
            conclusion=success
            if [ "$UPDATE_OUTCOME" != success ]; then conclusion=failure; fi
            if [ -f "$RUNNER_TEMP/nomreh-plesk-package.md" ]; then
              summary="$(cat "$RUNNER_TEMP/nomreh-plesk-package.md")"
            else
              summary='The package update did not produce a report; no build, restart, or further host change was attempted.'
            fi
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Plesk Nomreh package launcher update" \
            -f head_sha="${GITHUB_SHA}" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f 'output[title]=Nomreh validated package launcher update' \
            --raw-field "output[summary]=${summary}" > /dev/null
