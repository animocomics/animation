name: Deploy the VNC authentication response diagnostics

on:
  push:
    branches: [arena/f4b832aa-animation]
    paths: [.github/workflows/plesk-vnc-auth-diagnostics-deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: plesk-nomreh-browser
  cancel-in-progress: false

jobs:
  upload-extract-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and verify the two-file runtime delta
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nomreh-deploy-vnc-auth-diagnostics-v42.zip"
          git archive --format=zip --output="$archive" "$GITHUB_SHA" scripts/shecan-vnc-http.cjs scripts/shecan-vnc-websocket.cjs
          test "$(unzip -Z1 "$archive" | grep -vc '/$')" -eq 2
          unzip -Z1 "$archive" | grep -Fx 'scripts/shecan-vnc-http.cjs' > /dev/null
          grep -F 'const contentClass' scripts/shecan-vnc-websocket.cjs > /dev/null
          grep -F 'function originError(request)' scripts/shecan-vnc-http.cjs > /dev/null
          grep -F 'AUTH_UNCLASSIFIED' scripts/shecan-vnc-http.cjs > /dev/null
          grep -F 'AUTH_STORAGE' scripts/shecan-vnc-websocket.cjs > /dev/null
          grep -F 'await authorizeUpgrade(request, applicationPort);' scripts/shecan-vnc-http.cjs > /dev/null
          sha256sum "$archive"
      - name: Prepare an isolated temporary browser
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plesk-browser"
          cd "$RUNNER_TEMP/plesk-browser"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Upload the validated VNC proxy delta
        id: upload
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          PLESK_BROWSER_ACTION: upload
          PLESK_ARCHIVE_NAME: nomreh-deploy-vnc-auth-diagnostics-v42.zip
          PLESK_UPLOAD_ARCHIVE: ${{ runner.temp }}/nomreh-deploy-vnc-auth-diagnostics-v42.zip
          PLESK_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/nomreh-vnc-http-upload.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/plesk-browser-diagnostics.cjs
      - name: Extract and verify the exact hosted proxy source hash
        id: extract
        if: steps.upload.outcome == 'success'
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          PLESK_BROWSER_ACTION: extract
          PLESK_ARCHIVE_NAME: nomreh-deploy-vnc-auth-diagnostics-v42.zip
          PLESK_DELTA_SOURCE: ${{ github.sha }}
          PLESK_DELTA_FILES: scripts/shecan-vnc-http.cjs,scripts/shecan-vnc-websocket.cjs
          PLESK_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/nomreh-vnc-http-extract.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/plesk-browser-diagnostics.cjs
      - name: Restart only the existing Nomreh Node application
        id: restart
        if: steps.extract.outcome == 'success'
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          PLESK_BROWSER_ACTION: restart-runtime
          PLESK_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/nomreh-vnc-http-restart.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/plesk-browser-diagnostics.cjs
      - name: Validate the authenticated official app after this restart
        id: live
        if: steps.restart.outcome == 'success'
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          NOMREH_ADMIN_USERNAME: ${{ secrets.NOMREH_ADMIN_USERNAME }}
          NOMREH_ADMIN_PASSWORD: ${{ secrets.NOMREH_ADMIN_PASSWORD }}
          NOMREH_ALLOW_DEMO_ACCOUNTS: "1"
          NOMREH_OFFICIAL_ONLY: "1"
          NOMREH_VALIDATE_OFFICIAL_RUNTIME: "1"
          NOMREH_E2E_OUTPUT: ${{ runner.temp }}/nomreh-vnc-auth-live.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/nomreh-admin-readiness.cjs
      - name: Publish the sanitized deployment result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          RESTART_OUTCOME: ${{ steps.restart.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          set -euo pipefail
          conclusion=success
          if [ "$UPLOAD_OUTCOME" != success ] || [ "$EXTRACT_OUTCOME" != success ] || [ "$RESTART_OUTCOME" != success ] || [ "$LIVE_OUTCOME" != success ]; then conclusion=failure; fi
          summary='The VNC proxy delta did not produce a report; no live success was claimed.'
          for report in nomreh-vnc-auth-live.md nomreh-vnc-http-restart.md nomreh-vnc-http-extract.md nomreh-vnc-http-upload.md; do
            if [ -f "$RUNNER_TEMP/$report" ]; then summary="$(cat "$RUNNER_TEMP/$report")"; break; fi
          done
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Authenticated VNC auth diagnostics deployment" \
            -f head_sha="$GITHUB_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f 'output[title]=Bidirectional authenticated noVNC proxy on Plesk' \
            --raw-field "output[summary]=${summary}" > /dev/null
