name: Plesk Nomreh read-only memory snapshot

# The local test verifies CDP-level interception of every redirect hop.

on:
  push:
    branches: [arena/ccbdcb6e-animation]
    paths: [.github/workflows/plesk-resource-snapshot.yml]

permissions:
  contents: read
  checks: write

concurrency:
  group: plesk-nomreh-browser
  cancel-in-progress: false

jobs:
  resource-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check private Plesk configuration without displaying it
        id: config
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
        run: |
          configured=false
          if [ -n "$PLESK_PANEL_URL" ] && [ -n "$PLESK_API_USERNAME" ] && [ -n "$PLESK_API_PASSWORD" ]; then configured=true; fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
      - name: Prepare temporary browser
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plesk-browser"
          cd "$RUNNER_TEMP/plesk-browser"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Test the panel origin policy before contacting Plesk
        if: steps.config.outputs.configured == 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: |
          set -o pipefail
          node scripts/test-plesk-origin-policy.cjs 2>&1 | tee "$RUNNER_TEMP/origin-test.log"
      - name: Read only memory and process limits through Nomreh console
        id: snapshot
        if: steps.config.outputs.configured == 'true'
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          PLESK_BROWSER_ACTION: resource-check
          PLESK_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/resource-report.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/plesk-browser-diagnostics.cjs
      - name: Publish only resource markers
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED: ${{ steps.config.outputs.configured }}
          OUTCOME: ${{ steps.snapshot.outcome }}
        run: |
          set -euo pipefail
          conclusion=failure
          summary='No resource snapshot was confirmed; no VM was started.'
          if [ -f "$RUNNER_TEMP/origin-test.log" ]; then
            summary="Local synthetic origin test: $(tail -c 2000 "$RUNNER_TEMP/origin-test.log")"
          fi
          if [ "$CONFIGURED" = true ] && [ "$OUTCOME" = success ] && [ -f "$RUNNER_TEMP/resource-report.md" ]; then
            summary="$(grep '^- Resource: NOMREH_RESOURCE_' "$RUNNER_TEMP/resource-report.md")"
            conclusion=success
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='Nomreh read-only memory snapshot' -f head_sha="${GITHUB_SHA}" \
            -f status=completed -f conclusion="$conclusion" \
            -f 'output[title]=Resource snapshot, not a capacity guarantee' \
            --raw-field "output[summary]=${summary}" >/dev/null
