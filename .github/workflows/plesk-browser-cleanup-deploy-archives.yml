name: Plesk Nomreh safe deployment-archive cleanup

# Preserve the currently verified v23 archive. Delete only exact, redundant
# nomreh-deploy…zip files in Nomreh's application root after re-verifying it.

on:
  push:
    branches:
      - arena/f4b832aa-animation
    paths:
      - .github/workflows/plesk-browser-cleanup-deploy-archives.yml
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: plesk-nomreh-browser
  cancel-in-progress: false

jobs:
  cleanup-deploy-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check private Plesk browser configuration
        id: config
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
        run: |
          set -u
          configured=false
          if [ -n "$PLESK_PANEL_URL" ] && [ -n "$PLESK_API_USERNAME" ] && [ -n "$PLESK_API_PASSWORD" ]; then configured=true; fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Check out the guarded cleanup control
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Verify the currently running v23 host chain
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for run_id in 41546736280 41546956067 41547264488 41547465491; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status + " " + .conclusion')" = 'completed success'
          done
          node --check scripts/plesk-browser-diagnostics.cjs
          node - <<'NODE'
          const { cleanupCandidates } = require('./scripts/plesk-deploy-archives.cjs');
          const keep = 'nomreh-deploy-shecan-5353-v23-delta.zip';
          const selected = cleanupCandidates([keep, 'nomreh-deploy.zip', 'package.json', 'nomreh-data'], keep);
          if (JSON.stringify(selected) !== JSON.stringify(['nomreh-deploy.zip'])) process.exit(1);
          NODE

      - name: Prepare an isolated temporary browser
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plesk-browser"
          cd "$RUNNER_TEMP/plesk-browser"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Remove only verified redundant Nomreh deployment ZIPs
        id: cleanup
        if: steps.config.outputs.configured == 'true'
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          PLESK_BROWSER_ACTION: cleanup-deploy-archives
          PLESK_ARCHIVE_NAME: nomreh-deploy-shecan-5353-v23-delta.zip
          PLESK_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/nomreh-plesk-archive-cleanup.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/plesk-browser-diagnostics.cjs

      - name: Publish the sanitized cleanup result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIGURED: ${{ steps.config.outputs.configured }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          conclusion=neutral
          summary='Plesk browser cleanup is not configured; no host was contacted.'
          if [ "$CONFIGURED" = true ]; then
            conclusion=success
            if [ "$CLEANUP_OUTCOME" != success ]; then conclusion=failure; fi
            if [ -f "$RUNNER_TEMP/nomreh-plesk-archive-cleanup.md" ]; then
              summary="$(cat "$RUNNER_TEMP/nomreh-plesk-archive-cleanup.md")"
            else
              summary='The cleanup action did not produce a report. No subsequent deployment, build, restart, or settings change was attempted.'
            fi
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Plesk Nomreh safe deployment-archive cleanup" \
            -f head_sha="${GITHUB_SHA}" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f 'output[title]=Nomreh exact-archive-only cleanup' \
            --raw-field "output[summary]=${summary}" > /dev/null
