name: Deploy the official app HTTP console transport

on:
  push:
    branches: [arena/f4b832aa-animation]
    paths: [.github/workflows/plesk-official-http-deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: plesk-nomreh-browser
  cancel-in-progress: false

jobs:
  upload-extract-build-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and verify the bounded application delta
        env:
          DELTA_FILES: components/official-shecan-console.tsx,components/official-vnc-http-channel.ts,lib/server/provider-config.ts,lib/server/shecan-runtime.ts,scripts/next-server.cjs,scripts/shecan-runtime-watchdog.cjs,scripts/shecan-vnc-http.cjs,scripts/shecan-vnc-websocket.cjs,types/novnc.d.ts
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nomreh-deploy-official-http-v39.zip"
          git archive --format=zip --output="$archive" "$GITHUB_SHA" $(printf '%s' "$DELTA_FILES" | tr ',' ' ')
          test "$(unzip -Z1 "$archive" | grep -vc '/$')" -eq 9
          grep -F 'new OfficialVncHttpChannel' components/official-shecan-console.tsx > /dev/null
          grep -F 'handleShecanVncHttp(request, response, port)' scripts/next-server.cjs > /dev/null
          grep -F 'await authorizeUpgrade(request, applicationPort);' scripts/shecan-vnc-http.cjs > /dev/null
          grep -F 'transport: network.transport' lib/server/provider-config.ts > /dev/null
          sha256sum "$archive"
          stat -c 'Delta bytes: %s' "$archive"
      - name: Prepare an isolated temporary browser
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plesk-browser"
          cd "$RUNNER_TEMP/plesk-browser"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Upload the validated application delta
        id: upload
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          PLESK_BROWSER_ACTION: upload
          PLESK_ARCHIVE_NAME: nomreh-deploy-official-http-v39.zip
          PLESK_UPLOAD_ARCHIVE: ${{ runner.temp }}/nomreh-deploy-official-http-v39.zip
          PLESK_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/nomreh-http-upload.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/plesk-browser-diagnostics.cjs
      - name: Extract and hash-verify every hosted delta file
        id: extract
        if: steps.upload.outcome == 'success'
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          PLESK_BROWSER_ACTION: extract
          PLESK_ARCHIVE_NAME: nomreh-deploy-official-http-v39.zip
          PLESK_DELTA_SOURCE: ${{ github.sha }}
          PLESK_DELTA_FILES: components/official-shecan-console.tsx,components/official-vnc-http-channel.ts,lib/server/provider-config.ts,lib/server/shecan-runtime.ts,scripts/next-server.cjs,scripts/shecan-runtime-watchdog.cjs,scripts/shecan-vnc-http.cjs,scripts/shecan-vnc-websocket.cjs,types/novnc.d.ts
          PLESK_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/nomreh-http-extract.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/plesk-browser-diagnostics.cjs
      - name: Run and watch the real Nomreh production build
        id: build
        if: steps.extract.outcome == 'success'
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          PLESK_BROWSER_ACTION: build
          PLESK_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/nomreh-http-build.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/plesk-browser-diagnostics.cjs
      - name: Restart only the existing Nomreh Node application
        id: restart
        if: steps.build.outcome == 'success'
        env:
          PLESK_PANEL_URL: ${{ secrets.PLESK_PANEL_URL }}
          PLESK_API_USERNAME: ${{ secrets.PLESK_API_USERNAME }}
          PLESK_API_PASSWORD: ${{ secrets.PLESK_API_PASSWORD }}
          PLESK_BROWSER_ACTION: restart-runtime
          PLESK_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/nomreh-http-restart.md
          NODE_PATH: ${{ runner.temp }}/plesk-browser/node_modules
        run: node scripts/plesk-browser-diagnostics.cjs
      - name: Publish the sanitized deployment result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RESTART_OUTCOME: ${{ steps.restart.outcome }}
        run: |
          set -euo pipefail
          conclusion=success
          if [ "$UPLOAD_OUTCOME" != success ] || [ "$EXTRACT_OUTCOME" != success ] || [ "$BUILD_OUTCOME" != success ] || [ "$RESTART_OUTCOME" != success ]; then conclusion=failure; fi
          summary='The official HTTP console deployment did not produce a report; no live success was claimed.'
          for report in nomreh-http-restart.md nomreh-http-build.md nomreh-http-extract.md nomreh-http-upload.md; do
            if [ -f "$RUNNER_TEMP/$report" ]; then summary="$(cat "$RUNNER_TEMP/$report")"; break; fi
          done
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Official app HTTP console deployment" \
            -f head_sha="$GITHUB_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f 'output[title]=Authenticated HTTP raw-channel console on Plesk' \
            --raw-field "output[summary]=${summary}" > /dev/null
